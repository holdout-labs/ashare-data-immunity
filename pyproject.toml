[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-data-immunity"
version = "0.1.2"
description = "A-share daily-bar quality checks: OHLCV cleaning, board-aware price limits and suspensions, listing and continuity audits, and SHA-256 snapshot manifests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["a-share", "data-quality", "price-limit", "suspension", "cleaning", "snapshot", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
imm = "ashare_data_immunity.cli:main"
ashare-data-immunity = "ashare_data_immunity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

